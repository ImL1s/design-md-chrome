name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node tests/run-tests.mjs
      - name: Validate manifest.json
        run: node -e "const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if (m.manifest_version !== 3) throw new Error('manifest_version must be 3'); if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('version must be SemVer x.y.z');"
      - name: Syntax-check JS modules
        run: |
          for f in lib/*.mjs tests/*.mjs service-worker.js content-script.js; do
            node --check "$f"
          done
