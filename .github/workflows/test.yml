name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node tests/run-tests.mjs
      - name: Validate manifest.json
        run: node -e "const m = JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if (m.manifest_version !== 3) throw new Error('manifest_version must be 3'); if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('version must be SemVer x.y.z');"
      - name: Syntax-check JS modules
        run: |
          for f in lib/*.mjs tests/*.mjs service-worker.js content-script.js bin/*.mjs scripts/*.mjs; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - name: Ruler sync check
        run: node scripts/ruler-apply.mjs --check

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Integration tests
        run: node tests/run-integration-tests.mjs

  e2e-offline:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: E2E offline (budget 3 min)
        run: node tests/run-e2e-tests.mjs
